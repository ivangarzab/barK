# git-cliff configuration for barK
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to barK will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

---

"""
body = """
{% if version %}\
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}\
- {{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""
footer = """
{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version }}]: https://github.com/ivangarzab/barK/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version }}]: https://github.com/ivangarzab/barK/releases/tag/{{ release.version }}
{% endif -%}
{% else -%}
[Unreleased]: https://github.com/ivangarzab/barK/compare/{{ releases | nth(n=1) | get(key="version") | default(value="HEAD") }}...HEAD
{% endif -%}
{% endfor %}"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^chore", group = "Maintenance" },
  { message = "^design", group = "Design" },
  { message = "^cicd", group = "CI/CD" },
]
commit_preprocessors = [
  { pattern = "^Merge.*", replace = "" },
  { pattern = "^Update library's version.*", replace = "" },
  { pattern = "^Merge main into develop.*", replace = "" },
]
filter_commits = true
tag_pattern = "[0-9]+\\.[0-9]+\\.[0-9]+"
